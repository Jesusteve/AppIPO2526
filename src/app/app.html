<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ToolBox Go</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class=" container">
    <div class="menu-toggle" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <img src="/img/logo.png" alt="Logo toolBox Go " class="icono">
    <p>ToolBox Go</p>

    <div class="right-section">
      <button class="btn btn-login">Iniciar sesión</button>
      <button class="btn btn-register">Registrarse</button>
    </div>

    <nav class="side-menu" id="sideMenu">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Herramientas</a></li>
        <li><a href="#">Proyectos</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>



  </div>
  <div class="contenedor2">
    <h1 class="titulo">Encuentra tus herramientas</h1>

    <div class="search-box">
      <input type="text" class="buscador" placeholder="¿Qué herramienta necesitas?">
      <button class="btn-catalogo">Catálogo</button>
    </div>
    <button class="btn-extra">Buscar</button>


  </div>

  <script>
    function toggleMenu() {
      const sideMenu = document.getElementById('sideMenu');
      sideMenu.classList.toggle('open');
    }
  </script>
</body>
</html>
