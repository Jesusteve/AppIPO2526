<h1>¡MI PRIMERA APP!</h1>
<p>Hola, esto es HTML normal</p>

<!-- Esto es programación en el HTML -->
<button (click)="contador = contador + 1">Haz click</button>
<p>Has hecho click {{ contador }} veces</p>

<!-- Esto es un if como en programación normal -->
<p *ngIf="contador > 5">¡Wow, ya llevas más de 5 clicks!</p>
