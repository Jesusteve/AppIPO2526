
<div class="chat-container">
  <div class="chat-header">
    <h3>💬 Asistente IA Simple</h3>
  </div>

  <div class="messages-container" #messageContainer>
    <div *ngFor="let message of messages"
         [class]="message.isUser ? 'user-message' : 'bot-message'">
      <div class="message-content">
        {{ message.text }}
      </div>
      <div class="message-time">
        {{ message.time | date:'HH:mm' }}
      </div>
    </div>

    <div *ngIf="isTyping" class="typing-indicator">
      <span>Escribiendo</span>
      <div class="typing-dots">
        <span>.</span><span>.</span><span>.</span>
      </div>
    </div>
  </div>

  <div class="input-container">
    <input type="text"
           [(ngModel)]="userInput"
           (keyup.enter)="sendMessage()"
           placeholder="Escribe tu mensaje aquí..."
           [disabled]="isTyping">

    <button (click)="sendMessage()"
            [disabled]="!userInput.trim() || isTyping">
      {{ isTyping ? '...' : 'Enviar' }}
    </button>
  </div>

  <div class="suggestions" *ngIf="messages.length === 0">
    <p>Prueba preguntarme:</p>
    <button class="suggestion-btn" (click)="quickQuestion('Hola')">👋 Hola</button>
    <button class="suggestion-btn" (click)="quickQuestion('Cómo estás')">😊 ¿Cómo estás?</button>
    <button class="suggestion-btn" (click)="quickQuestion('Qué puedes hacer')">❓ ¿Qué puedes hacer?</button>
  </div>
</div>
